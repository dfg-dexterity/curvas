      color: var(--dx-dark);
      padding: 10px 12px;
      border-radius: 12px;

    select{ min-width: 420px; }

    button{

    button:disabled{ opacity:.55; cursor:not-allowed; }

    .grid{ display:grid; grid-template-columns: repeat(12, 1fr); gap: 12px; margin-top: 16px; }

    .card{
      background: linear-gradient(180deg, rgba(248,243,230,.96), rgba(248,243,230,.86));

      border-radius: var(--radius);

      padding: 14px;

    .span4{ grid-column: span 4; }
    .span8{ grid-column: span 8; }
    .span12{ grid-column: span 12; }

    .kpi-title{ color: var(--muted); font-size:12px; margin-bottom:6px; }
    .kpi-value{ font-size:22px; font-weight:950; letter-spacing:.2px; color: var(--dx-dark); }
    .kpi-foot{ margin-top:6px; color: var(--muted); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .pill{
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(73,73,73,.20);
      background: rgba(248,243,230,.75);
      color: rgba(73,73,73,.88);

    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .status{ font-size:12px; color: var(--muted); }

    thead th{

    .right{ text-align:right; }

      .span8{ grid-column: span 12; }

    s = String(s).trim();
    return (/^\d+$/.test(s)) ? s.padStart(3, "0") : s;
  }

  function fmtNumber(n){
    if (!Number.isFinite(n)) return "—";
    return n.toLocaleString("pt-BR", { minimumFractionDigits: 6, maximumFractionDigits: 6 });
  }

  function parseBndesTxt(text){
    // TXT do BNDES costuma vir em 1 linha: "data ; valor DD/MM/AAAA; 5,009785 ..."
    const cleaned = text.replace(/\r?\n/g, " ").trim();
    let t = cleaned.replace(/^data\s*;\s*valor\s*/i, "");

    // BNDES separa o sinal do número com espaços nos negativos: "15/09/2025;-      0,110000"
    const re = /(\d{2}\/\d{2}\/\d{4})\s*;\s*([+-]?\s*\d+(?:,\d+)?)/g;
    const out = [];
    let m;
    while ((m = re.exec(t)) !== null){
      const dateStr = m[1];
      const valStr = m[2];
      const value = Number(valStr.replace(/\s+/g, "").replace(",", "."));
      const [dd, mm, yyyy] = dateStr.split("/").map(Number);
      out.push({ dateStr, date: new Date(yyyy, mm-1, dd), value });
    }
    return out.sort((a,b) => b.date - a.date);
  }

    kpiVal.textContent = fmtNumber(last.value);
    kpiDate.textContent = `Data: ${last.dateStr}`;
    kpiCode.textContent = `Código: ${cod3} • ${sigla}`;

    if (prev){
      const delta = last.value - prev.value;
      const pct = (prev.value !== 0) ? (delta / prev.value) * 100 : NaN;

      kpiDelta.textContent = fmtNumber(delta);

      kpiDeltaPct.classList.remove("good","bad");
      if (Number.isFinite(delta) && delta >= 0) kpiDeltaPct.classList.add("good");
      if (Number.isFinite(delta) && delta < 0) kpiDeltaPct.classList.add("bad");

      kpiDeltaPct.textContent = Number.isFinite(pct)
        ? `${pct.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2})}%`
        : "—";

      kpiPrev.textContent = `Anterior: ${prev.dateStr} • ${fmtNumber(prev.value)}`;
    } else {
      kpiDelta.textContent = "—";
      kpiDeltaPct.textContent = "—";
      kpiPrev.textContent = "Anterior: —";
    }
  }

  function renderTable(rows){
    tbody.innerHTML = "";
    const frag = document.createDocumentFragment();
    for (const r of rows){
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.textContent = r.dateStr;
      const td2 = document.createElement("td"); td2.textContent = fmtNumber(r.value); td2.className = "right";
      tr.appendChild(td1);
      tr.appendChild(td2);
      frag.appendChild(tr);
    }
    tbody.appendChild(frag);
    countEl.textContent = `${rows.length} linhas`;
  }

  function renderChart(rows){
    const asc = [...rows].sort((a,b) => a.date - b.date);
    const labels = asc.map(r => r.dateStr);
    const data = asc.map(r => r.value);

    const ctx = document.getElementById("chart");
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Valor",
          data,
          tension: 0.2,
          pointRadius: 0,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { maxTicksLimit: 12 } } }
      }
    });
  }

  function applyFilterAndSort(){
    const q = filterEl.value.trim().toLowerCase();

    viewRows = !q
      ? [...rawRows]
      : rawRows.filter(r => r.dateStr.toLowerCase().includes(q));

    // sort
    const rows = [...viewRows];
    rows.sort((a,b) => {
      const av = (sortKey === "date") ? a.date.getTime() : a.value;
      const bv = (sortKey === "date") ? b.date.getTime() : b.value;
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    viewRows = rows;

    renderTable(viewRows);
    renderChart(viewRows);
  }

  function toCsv(rows){
    const lines = ["data;valor"];
    for (const r of rows){
      const v = r.value.toLocaleString("pt-BR", { minimumFractionDigits: 6, maximumFractionDigits: 6 });
      lines.push(`${r.dateStr};${v}`);
    }
    return lines.join("\n");
  }

  function downloadBlob(content, filename, mime){
    const blob = new Blob([content], { type: mime });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async function loadSeries(){
    const item = MAP[sel.selectedIndex];
    const sigla = item.sigla;
    const cod3 = pad3(item.codigo);

    const fileUrl = `${BASE}${cod3}`;

    btn.disabled = true;
    btnCsv.disabled = true;
    btnXlsx.disabled = true;
    statusEl.textContent = "Carregando...";
    rawRows = [];
    viewRows = [];
    renderTable([]);
    if (chart) chart.destroy();

    try{
      const res = await fetch(fileUrl, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();

      const rows = parseBndesTxt(text);
      rawRows = rows;
      viewRows = [...rows];

      renderKPIs(rows, sigla, cod3);

      // default sort
      sortKey = "date";
      sortDir = "desc";

      applyFilterAndSort();

      statusEl.textContent = `OK • ${sigla} (${cod3})`;
      btnCsv.disabled = rows.length === 0;
      btnXlsx.disabled = rows.length === 0;

      // persist selection
      localStorage.setItem("bndes_um_last_code", cod3);
    } catch(err){
      statusEl.textContent = `Erro ao baixar: ${err.message}`;
    } finally{
      btn.disabled = false;
    }
  }

  // ---- Init select ----
  MAP.sort((a,b) => a.sigla.localeCompare(b.sigla, "pt-BR"));
  for (const m of MAP){
    const opt = document.createElement("option");
    opt.value = m.codigo;
    opt.textContent = `${m.sigla} • ${pad3(m.codigo)}`;
    sel.appendChild(opt);
  }

  // Restore last selection
  const last = localStorage.getItem("bndes_um_last_code");
  if (last){
    const idx = MAP.findIndex(x => pad3(x.codigo) === pad3(last));
    if (idx >= 0) sel.selectedIndex = idx;
  }

  // sort table by clicking headers
  document.querySelectorAll("#tbl thead th").forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      if (k === "date") {
        if (sortKey === "date") sortDir = (sortDir === "asc") ? "desc" : "asc";
        else { sortKey = "date"; sortDir = "desc"; }
      } else {
        if (sortKey === "value") sortDir = (sortDir === "asc") ? "desc" : "asc";
        else { sortKey = "value"; sortDir = "desc"; }
      }
      applyFilterAndSort();
    });
  });

  filterEl.addEventListener("input", applyFilterAndSort);
  btn.addEventListener("click", loadSeries);

  btnCsv.addEventListener("click", () => {
    const item = MAP[sel.selectedIndex];
    const cod3 = pad3(item.codigo);
    const siglaSafe = item.sigla.replace(/[^\w\-]+/g, "_");
    const csv = toCsv(viewRows);
    downloadBlob(csv, `bndes_um_${cod3}_${siglaSafe}.csv`, "text/csv;charset=utf-8");
  });

  btnXlsx.addEventListener("click", () => {
    const item = MAP[sel.selectedIndex];
    const cod3 = pad3(item.codigo);
    const siglaSafe = item.sigla.replace(/[^\w\-]+/g, "_");

    const aoa = [["data","valor"]];
    for (const r of viewRows) aoa.push([r.dateStr, r.value]);

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "serie");
    XLSX.writeFile(wb, `bndes_um_${cod3}_${siglaSafe}.xlsx`);
  });

  // Auto-load first/last selection
  loadSeries();
</script>
</body>
</html>
